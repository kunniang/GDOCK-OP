#=================================================
#   Description: Build G-DOCK FROM LEAN'S LEDE
#   Author: JK (Optimized)
#=================================================

name: Build G-DOCK

on:
  # 去掉后会自动编译
  # release:
  #   types: [published]
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) 2>/dev/null || true
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
          g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

    - name: Clone source code
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede lede

    - name: Run DIY script & Update Feeds
      run: |
        cd lede
        # 1. 执行外层 diy.sh
        chmod +x ../diy.sh
        ../diy.sh

        # 2. 更新 Feeds 仓库索引
        ./scripts/feeds update -a

        # 3. 此时 feeds 目录已经存在，安全移除自带的旧版本冲突包（末尾加 || true 保证零报错）
        rm -rf feeds/packages/net/chinadns-ng || true
        rm -rf feeds/packages/net/sing-box || true
        rm -rf feeds/packages/net/xray-core || true
        rm -rf feeds/packages/net/hysteria || true

        # 4. 安装全部 Feeds
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd lede
        cp -f ../gdockfull128.config .config
        
        # 兼容性替换：自动纠正历史 config 文件中的多余 DEVICE_ 字符
        sed -i 's/CONFIG_TARGET_DEVICE_ipq40xx/CONFIG_TARGET_ipq40xx/g' .config

        # 确保竞斗云基础平台选中
        echo "CONFIG_TARGET_ipq40xx=y" >> .config
        echo "CONFIG_TARGET_ipq40xx_generic=y" >> .config

        make defconfig

        # 兼容匹配竞斗云机型符号（支持带或不带 -128m）
        if ! grep -qE "CONFIG_TARGET_ipq40xx_generic_DEVICE_p2w_r619ac(=y|-128m=y)" .config; then
          echo "::error::未成功选中竞斗云 2.0 (p2w_r619ac) 目标机型，请检查 .config！"
          exit 1
        fi

    - name: Load custom configuration
      run: |
        cd lede
        cp -f ../gdockfull128.config .config
        
        # 兼容性替换：自动纠正历史 config 文件中的多余 DEVICE_ 字符
        sed -i 's/CONFIG_TARGET_DEVICE_ipq40xx/CONFIG_TARGET_ipq40xx/g' .config

        # 确保竞斗云基础平台选中
        echo "CONFIG_TARGET_ipq40xx=y" >> .config
        echo "CONFIG_TARGET_ipq40xx_generic=y" >> .config

        make defconfig

        # 兼容匹配竞斗云机型符号（支持带或不带 -128m）
        if ! grep -qE "CONFIG_TARGET_ipq40xx_generic_DEVICE_p2w_r619ac(=y|-128m=y)" .config; then
          echo "::error::未成功选中竞斗云 2.0 (p2w_r619ac) 目标机型，请检查 .config！"
          exit 1
        fi

    - name: Download package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd lede
        echo -e "$(nproc) thread build."
        make -j$(nproc) || make -j1 V=s

    - name: Prepare artifact
      run: |
        cd lede/bin/targets/ipq40xx/generic
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-DOCK-R619AC-128M
        path: ${{ env.FIRMWARE_PATH }}
