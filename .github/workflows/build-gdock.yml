#=================================================
#   Description: Build G-DOCK FROM LEAN'S LEDE
#   Author: JK (Optimized)
#=================================================

name: Build G-DOCK

on:
  # 去掉后会自动编译
  # release:
  #   types: [published]
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) 2>/dev/null || true
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
          g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

    - name: Clone source code
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede lede

    - name: Run DIY script
      run: |
        cd lede
        chmod +x ../diy.sh
        ../diy.sh

    - name: Update and install feeds
      run: |
        cd lede
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clean conflicting feed packages
      run: |
        cd lede
        # passwall 依赖的这批包在 feeds 里也有旧版本，会与 passwall 官方版本冲突，
        # 需要连同 package/feeds 下的软链接一起删掉，否则会留下断链。
        DEPS="chinadns-ng dns2socks geoview hysteria ipt2socks microsocks naiveproxy \
              shadow-tls shadowsocks-rust shadowsocksr-libev simple-obfs sing-box \
              smartdns tcping v2ray-geodata v2ray-plugin xray-core xray-plugin"
        for p in $DEPS; do
          rm -rf "feeds/packages/net/$p" "package/feeds/packages/$p"
        done
        rm -rf feeds/luci/applications/luci-app-passwall package/feeds/luci/luci-app-passwall

    - name: Clone Passwall
      run: |
        cd lede
        # 注意：passwall 已从 xiaorouji 账号迁移到 Openwrt-Passwall 组织，
        # 旧的 https://github.com/xiaorouji/openwrt-passwall.git 已 404。
        git clone --depth=1 -b main \
          https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall_packages
        git clone --depth=1 -b main \
          https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall

        # 校验克隆结果，避免后续 make 阶段才暴露问题
        test -f package/passwall/luci-app-passwall/Makefile \
          || { echo "::error::passwall luci 克隆失败或目录结构异常"; exit 1; }
        test -d package/passwall_packages/sing-box \
          || { echo "::error::passwall packages 克隆失败或目录结构异常"; exit 1; }

    - name: Load custom configuration
      run: |
        cd lede
        cp -f ../gdockfull128.config .config

        # 兼容性替换：自动纠正历史 config 文件中的多余 DEVICE_ 字符
        sed -i 's/CONFIG_TARGET_DEVICE_ipq40xx/CONFIG_TARGET_ipq40xx/g' .config

        # 确保竞斗云基础平台与机型选中
        {
          echo "CONFIG_TARGET_ipq40xx=y"
          echo "CONFIG_TARGET_ipq40xx_generic=y"
          echo "CONFIG_TARGET_ipq40xx_generic_DEVICE_p2w_r619ac=y"
        } >> .config

        make defconfig

        # 兼容匹配竞斗云机型符号（只要包含 r619ac 且赋值为 y 即可）
        if ! grep -qE "CONFIG_TARGET_.*_DEVICE_.*r619ac.*=y" .config; then
          echo "::error::未成功选中竞斗云 (r619ac) 目标机型，请检查 .config！"
          exit 1
        fi

        # 关键依赖自检：passwall 若被 defconfig 丢掉，这里直接报警
        if ! grep -qE "^CONFIG_PACKAGE_luci-app-passwall=y" .config; then
          echo "::error::luci-app-passwall 未被选中，请检查包名/依赖是否齐全"
          exit 1
        fi

    - name: Download package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd lede
        echo -e "$(nproc) thread build."
        make -j$(nproc) || make -j1 V=s

    - name: Prepare artifact
      run: |
        cd lede/bin/targets/ipq40xx/generic
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-DOCK-R619AC-128M
        path: ${{ env.FIRMWARE_PATH }}
