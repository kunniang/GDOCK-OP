
#=================================================
#   Description: Build G-DOCK FROM LEAN'S LEDE
#   Author: JK
#=================================================

name: Build G-DOCK

on:
  release:
    types: [published]

  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # Checkout source code
    - name: Checkout
      uses: actions/checkout@v4

    # Check build environment
    - name: Check Ubuntu version
      run: |
        echo "===== Ubuntu Version ====="
        cat /etc/os-release

        echo "===== CMake Version ====="
        cmake --version

        echo "===== GCC Version ====="
        gcc --version

    # Clean up Docker images
    - name: Clean up Docker images
      run: |
        images=$(docker images -q)

        if [ -n "$images" ]; then
          docker rmi $images
        else
          echo "No Docker images to remove"
        fi

    # Install build dependencies
    - name: Install dependencies
      run: |
        sudo -E apt-get update

        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache clang cmake \
          cpio curl device-tree-compiler flex gawk gcc-multilib \
          g++-multilib gettext genisoimage git gperf haveged \
          help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool \
          llvm lrzsz msmtp ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

    # Clone LEDE source code
    - name: Clone source code
      run: |
        git clone https://github.com/coolsnowwolf/lede lede

    # Update feeds
    - name: Update feeds
      run: |
        cd lede
        ./scripts/feeds update -a

    # Install feeds
    - name: Install feeds
      run: |
        cd lede
        ./scripts/feeds install -a

    # Load custom configuration and fix dwarves
    - name: Load custom configuration
      run: |
        cp -f gdockfull128.config ./lede/.config

        chmod +x diy.sh

        cd lede

        ../diy.sh

        echo "===== Fix dwarves CMake compatibility ====="

        mkdir -p tools/dwarves/patches

        cat > tools/dwarves/patches/001-cmake-minimum-version.patch <<'EOF'
--- a/CMakeLists.txt
+++ b/CMakeLists.txt
@@ -1 +1 @@
-cmake_minimum_required(VERSION 2.8.12)
+cmake_minimum_required(VERSION 3.5)
EOF

        echo "===== dwarves patch created ====="

        make defconfig

    # Download packages
    - name: Download package
      run: |
        echo -e "$(nproc) thread build."

        cd lede

        make download -j$(nproc)

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;

    # Build firmware
    - name: Build
      run: |
        cd lede

        echo -e "$(nproc) thread build."

        make -j$(nproc) V=s

    # Upload build artifacts
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-DOCK
        path: ./lede/bin
