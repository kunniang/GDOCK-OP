#=================================================
#   Description: Build G-DOCK FROM LEAN'S LEDE
#   Author: JK (Optimized)
#=================================================

name: Build G-DOCK

on:
  release:
    types: [published]
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) 2>/dev/null || true
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
          g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

    - name: Clone source code
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede lede

    - name: Run DIY script & Update Feeds
      run: |
        cd lede
        # 执行外层 diy.sh 修改源与配置
        chmod +x ../diy.sh
        ../diy.sh

        # 更新并安装 Feeds（必须在追加源之后执行）
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd lede
        cp -f ../gdockfull128.config .config
        make defconfig
        # 检查是否成功锁定了 r619ac 设备
        grep -i "r619ac" .config || (echo "Error: R619AC device profile not matched!" && exit 1)

    - name: Download package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd lede
        echo -e "$(nproc) thread build."
        make -j$(nproc) || make -j1 V=s

    - name: Prepare artifact
      run: |
        cd lede/bin/targets/ipq40xx/generic
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-DOCK-R619AC-128M
        path: ${{ env.FIRMWARE_PATH }}
